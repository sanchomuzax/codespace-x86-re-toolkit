name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository contract
        run: python3 scripts/validate_skill.py
      - name: Compile Python sources
        run: >-
          python3 -m py_compile
          skills/codespace-x86-re/scripts/codespace_re.py
          scripts/install_skill.py
          scripts/validate_skill.py

  official-skill-validation:
    runs-on: ubuntu-latest
    env:
      SKILLS_REF_COMMIT: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Agent Skills reference validator
        run: |
          python -m pip install \
            "git+https://github.com/agentskills/agentskills.git@${SKILLS_REF_COMMIT}#subdirectory=skills-ref"
      - name: Validate Agent Skill against the official specification
        run: skills-ref validate skills/codespace-x86-re
